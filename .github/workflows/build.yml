name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Build APK
      run: |
        # 创建新的Flutter项目
        flutter create --org com.lushuaih temp_project
        
        # 复制我们的代码
        cp lib/main.dart temp_project/lib/main.dart
        
        # 编译APK
        cd temp_project
        flutter pub get
        flutter build apk --release
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: lushuaih-apk
        path: temp_project/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
