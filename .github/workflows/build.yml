name: Build APK & IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Build APK
      run: |
        flutter create --org com.lushuaih --project-name lushuaih temp_project
        cp lib/main.dart temp_project/lib/main.dart
        cp -r assets temp_project/assets || true
        cd temp_project
        flutter pub get
        flutter build apk --debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: lushuaih-APK
        path: temp_project/build/app/outputs/flutter-apk/app-debug.apk
        retention-days: 30
    
    - name: Create Release with APK
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'push'
      with:
        tag_name: v${{ github.run_number }}
        name: lushuaih v${{ github.run_number }} 🔥AI社区论坛🔥
        body: |
          ## LusHuaih AI 社区论坛应用
          
          ### 🎯 功能特性
          - 🔥 AI智能助手集成
          - 💬 实时社区论坛
          - 🤖 GPT对话体验
          - 📱 支持Android/iOS
          
          ### 📥 下载安装
          - **Android APK**: 下载附件中的 `.apk` 文件
          - **iOS IPA**: 使用AltStore安装
          
          ### 🏷️ 标签
          AI GPT LLM 智能助手 人工智能 AI Agent ChatBot 社区 论坛
        files: temp_project/build/app/outputs/flutter-apk/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Build iOS
      run: |
        flutter create --org com.lushuaih --project-name lushuaih temp_project
        cp lib/main.dart temp_project/lib/main.dart
        cp -r assets temp_project/assets || true
        cd temp_project
        flutter pub get
        flutter build ios --no-codesign --debug || true
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: lushuaih-IPA
        path: temp_project/build/ios/iphoneos/*.app
        retention-days: 30
        if-no-files-found: ignore
