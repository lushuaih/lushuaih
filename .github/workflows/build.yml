name: Build APK & IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Build APK
      run: |
        flutter create --org com.lushuaih --project-name lushuaih temp_project
        cp lib/main.dart temp_project/lib/main.dart
        cp -r assets temp_project/assets 2>/dev/null || true
        cd temp_project
        flutter pub get
        flutter build apk --debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: lushuaih-APK-Android
        path: temp_project/build/app/outputs/flutter-apk/app-debug.apk
        retention-days: 30

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Build iOS
      run: |
        flutter create --org com.lushuaih --project-name lushuaih temp_project
        cp lib/main.dart temp_project/lib/main.dart
        cp -r assets temp_project/assets 2>/dev/null || true
        cd temp_project
        flutter pub get
        flutter build ios --no-codesign --debug
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: lushuaih-IPA-iOS
        path: temp_project/build/ios/iphoneos/*.app
        retention-days: 30
        if-no-files-found: warn
